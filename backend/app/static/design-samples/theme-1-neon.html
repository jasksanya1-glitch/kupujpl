<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styl 1 — Cyber Neon | KupujPL</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Exo+2:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050810;
            --surface: #0c1220;
            --border: #1a3a5c;
            --neon-c: #00f0ff;
            --neon-m: #ff00aa;
            --text: #e0f4ff;
            --muted: #6a8fad;
            --price: #00ff88;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Exo 2', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            background-image:
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(0, 240, 255, 0.12), transparent),
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: auto, 40px 40px, 40px 40px;
        }
        .wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }
        .badge { position: fixed; top: 12px; right: 12px; z-index: 99; background: rgba(0,240,255,0.15); border: 1px solid var(--neon-c); color: var(--neon-c); padding: 6px 14px; font-family: Orbitron, sans-serif; font-size: 11px; letter-spacing: 0.1em; border-radius: 4px; }
        header {
            display: flex; align-items: center; gap: 20px; height: 70px;
            border-bottom: 1px solid var(--border);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.08);
        }
        .logo { font-family: Orbitron, sans-serif; font-size: 22px; font-weight: 700; text-decoration: none; color: var(--text); }
        .logo span { color: var(--neon-m); text-shadow: 0 0 12px var(--neon-m); }
        .search {
            flex: 1; max-width: 420px; height: 42px;
            background: rgba(0, 240, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 0 16px;
            color: var(--text);
            font: inherit;
        }
        .search:focus { outline: none; border-color: var(--neon-c); box-shadow: 0 0 12px rgba(0, 240, 255, 0.3); }
        .nav a { color: var(--neon-c); text-decoration: none; font-size: 14px; margin-left: 12px; }
        .hero {
            padding: 28px 0;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }
        .hero h1 {
            font-family: Orbitron, sans-serif;
            font-size: clamp(1.4rem, 3vw, 2rem);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
        }
        .hero p { color: var(--muted); margin-top: 8px; font-size: 14px; }
        .cats { display: flex; gap: 8px; flex-wrap: wrap; padding: 20px 0; }
        .cat {
            padding: 8px 16px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            font: inherit; font-size: 13px;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.2s;
        }
        .cat.active, .cat:hover {
            border-color: var(--neon-c);
            color: var(--neon-c);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.25);
        }
        .section-title {
            font-family: Orbitron, sans-serif;
            font-size: 14px;
            letter-spacing: 0.2em;
            color: var(--neon-m);
            margin-bottom: 16px;
            text-transform: uppercase;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            padding-bottom: 40px;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 4px;
            overflow: hidden;
            transition: 0.25s;
            position: relative;
        }
        .card:hover {
            border-color: var(--neon-c);
            box-shadow: 0 0 24px rgba(0, 240, 255, 0.2), inset 0 0 20px rgba(0, 240, 255, 0.03);
            transform: translateY(-3px);
        }
        .card img { width: 100%; aspect-ratio: 460/215; object-fit: cover; display: block; }
        .card-body { padding: 12px; }
        .card h3 { font-size: 14px; font-weight: 600; margin-bottom: 8px; line-height: 1.3; }
        .price {
            font-family: Orbitron, sans-serif;
            color: var(--price);
            font-size: 16px;
            text-shadow: 0 0 8px rgba(0, 255, 136, 0.5);
        }
        .price small { font-size: 11px; color: var(--muted); font-family: 'Exo 2', sans-serif; }
    </style>
</head>
<body>
    <div class="badge">PODGLĄD · STYL 1</div>
    <header class="wrap">
        <a class="logo" href="#">Kupuj<span>PL</span> Gry</a>
        <input class="search" type="search" placeholder="Szukaj gry…">
        <nav class="nav"><a href="#">Zaloguj</a></nav>
    </header>
    <div class="hero wrap">
        <h1>Porównuj ceny · PLN</h1>
        <p>87 000+ gier · Steam · GOG · Epic · Humble · Kinguin</p>
    </div>
    <main class="wrap">
        <div class="cats">
            <button class="cat active">Wszystkie</button>
            <button class="cat">Akcja</button>
            <button class="cat">RPG</button>
            <button class="cat">Indie</button>
            <button class="cat">Strategie</button>
        </div>
        <p class="section-title">🔥 Top teraz</p>
        <div class="grid">
            <article class="card">
                <img src="https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/730/header.jpg" alt="">
                <div class="card-body"><h3>Counter-Strike 2</h3><div class="price"><small>od </small>0,00 zł</div></div>
            </article>
            <article class="card">
                <img src="https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/292030/header.jpg" alt="">
                <div class="card-body"><h3>Wiedźmin 3: Dziki Gon</h3><div class="price"><small>od </small>29,80 zł</div></div>
            </article>
            <article class="card">
                <img src="https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/1091500/header.jpg" alt="">
                <div class="card-body"><h3>Cyberpunk 2077</h3><div class="price"><small>od </small>119,99 zł</div></div>
            </article>
            <article class="card">
                <img src="https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/1145360/header.jpg" alt="">
                <div class="card-body"><h3>Hades</h3><div class="price"><small>od </small>47,99 zł</div></div>
            </article>
            <article class="card">
                <img src="https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/1245620/header.jpg" alt="">
                <div class="card-body"><h3>ELDEN RING</h3><div class="price"><small>od </small>149,99 zł</div></div>
            </article>
        </div>
    </main>
</body>
</html>
