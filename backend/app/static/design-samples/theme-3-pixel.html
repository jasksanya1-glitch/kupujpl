<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styl 3 — Retro Pixel | KupujPL</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #1a1c2c;
            --surface: #262b44;
            --border: #5d275d;
            --text: #fff;
            --muted: #94b0c2;
            --accent: #38b764;
            --price: #a7f070;
            --pixel: #ffcd75;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'VT323', monospace;
            font-size: 20px;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            image-rendering: pixelated;
        }
        .wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }
        .badge {
            position: fixed; top: 12px; right: 12px; z-index: 99;
            font-family: 'Press Start 2P', monospace;
            font-size: 8px; line-height: 1.6;
            background: var(--surface); border: 4px solid var(--border);
            padding: 8px; color: var(--pixel);
        }
        header {
            display: flex; align-items: center; gap: 16px;
            padding: 16px 0;
            border-bottom: 4px solid var(--border);
        }
        .logo {
            font-family: 'Press Start 2P', monospace;
            font-size: 12px; line-height: 1.8;
            text-decoration: none; color: var(--pixel);
        }
        .search {
            flex: 1; max-width: 360px; height: 40px;
            background: #000;
            border: 4px solid var(--accent);
            padding: 0 12px;
            color: var(--price);
            font-family: 'VT323', monospace;
            font-size: 22px;
        }
        .nav a { color: var(--accent); text-decoration: none; font-size: 22px; }
        .hero {
            padding: 24px 0;
            text-align: center;
            border-bottom: 4px dashed var(--border);
        }
        .hero h1 {
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(10px, 2.5vw, 14px);
            line-height: 2;
            color: var(--price);
        }
        .hero p { color: var(--muted); margin-top: 12px; }
        .cats { display: flex; gap: 8px; flex-wrap: wrap; padding: 16px 0; }
        .cat {
            padding: 8px 12px;
            background: var(--surface);
            border: 4px solid #000;
            color: var(--muted);
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            cursor: pointer;
            box-shadow: 4px 4px 0 #000;
        }
        .cat.active { background: var(--accent); color: #000; border-color: var(--price); }
        .cat:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #000; }
        .section-title {
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            color: var(--pixel);
            margin-bottom: 16px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
            padding-bottom: 40px;
        }
        .card {
            background: var(--surface);
            border: 4px solid #000;
            box-shadow: 6px 6px 0 #000;
            overflow: hidden;
        }
        .card:hover { border-color: var(--accent); }
        .card img { width: 100%; aspect-ratio: 460/215; object-fit: cover; image-rendering: auto; }
        .card-body { padding: 10px; border-top: 4px solid #000; }
        .card h3 {
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            line-height: 1.8;
            margin-bottom: 10px;
        }
        .price { color: var(--price); font-size: 24px; }
    </style>
</head>
<body>
    <div class="badge">PODGLĄD<br>STYL 3</div>
    <header class="wrap">
        <a class="logo" href="#">KUPUJ PL<br>GRY</a>
        <input class="search" type="search" placeholder="> SZUKAJ...">
        <nav class="nav"><a href="#">LOGIN</a></nav>
    </header>
    <div class="hero wrap">
        <h1>★ PORÓWNUJ CENY ★</h1>
        <p>87K+ GIER · STEAM · GOG · EPIC</p>
    </div>
    <main class="wrap">
        <div class="cats">
            <button class="cat active">ALL</button>
            <button class="cat">AKCJA</button>
            <button class="cat">RPG</button>
            <button class="cat">INDIE</button>
        </div>
        <p class="section-title">▶ TOP GRY</p>
        <div class="grid">
            <article class="card">
                <img src="https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/730/header.jpg" alt="">
                <div class="card-body"><h3>CS2</h3><div class="price">0 zł</div></div>
            </article>
            <article class="card">
                <img src="https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/292030/header.jpg" alt="">
                <div class="card-body"><h3>WIEDZMIN 3</h3><div class="price">29 zł</div></div>
            </article>
            <article class="card">
                <img src="https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/1091500/header.jpg" alt="">
                <div class="card-body"><h3>CYBERPUNK</h3><div class="price">119 zł</div></div>
            </article>
            <article class="card">
                <img src="https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/1145360/header.jpg" alt="">
                <div class="card-body"><h3>HADES</h3><div class="price">47 zł</div></div>
            </article>
            <article class="card">
                <img src="https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/1245620/header.jpg" alt="">
                <div class="card-body"><h3>ELDEN RING</h3><div class="price">149 zł</div></div>
            </article>
        </div>
    </main>
</body>
</html>
