<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styl 8 — Matrix Terminal | KupujPL</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root{--green:#00ff41;--dark:#0a0f0a;--dim:#003b00;--text:#00ff41;--muted:#008f11}
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Share Tech Mono',monospace;background:var(--dark);color:var(--text);min-height:100vh}
        body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.15),rgba(0,0,0,.15) 1px,transparent 1px,transparent 2px);pointer-events:none;z-index:1}
        .wrap{max-width:1180px;margin:0 auto;padding:0 20px;position:relative;z-index:2}
        .badge{position:fixed;top:12px;right:12px;z-index:99;border:1px solid var(--green);padding:6px 12px;font-size:11px;color:var(--green)}
        header{display:flex;align-items:center;gap:16px;height:64px;border-bottom:1px solid var(--dim)}
        .logo{font-size:18px;text-decoration:none;color:var(--green)}
        .logo span{opacity:.6}
        .logo::before{content:'> '}
        .search{flex:1;max-width:420px;height:36px;background:#000;border:1px solid var(--green);padding:0 12px;color:var(--green);font:inherit}
        .search::placeholder{color:var(--muted)}
        .nav a{color:var(--green);text-decoration:none;font-size:14px}
        .nav a::before{content:'['}.nav a::after{content:']'}
        .hero{padding:32px 0}
        .hero h1{font-size:clamp(1.2rem,3vw,1.8rem);font-weight:400;text-shadow:0 0 8px var(--green)}
        .hero h1::before{content:'$ '}
        .hero p{color:var(--muted);margin-top:8px;font-size:14px}
        .cats{display:flex;gap:0;flex-wrap:wrap;padding:16px 0}
        .cat{padding:6px 14px;border:1px solid var(--dim);background:transparent;color:var(--muted);font:inherit;font-size:13px;cursor:pointer;margin-right:-1px}
        .cat.active{background:var(--dim);color:var(--green);border-color:var(--green)}
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1px;background:var(--dim);padding-bottom:40px}
        .card{background:var(--dark);overflow:hidden;transition:.2s}
        .card:hover{background:#0d150d;box-shadow:inset 0 0 20px rgba(0,255,65,.1)}
        .card img{width:100%;aspect-ratio:460/215;object-fit:cover;filter:grayscale(1) sepia(1) hue-rotate(70deg) saturate(3) brightness(.7)}
        .card-body{padding:12px;border-top:1px solid var(--dim)}
        .card h3{font-size:14px;margin-bottom:4px;font-weight:400}
        .card h3::before{content:'// '}
        .price{color:var(--green);font-size:16px;text-shadow:0 0 6px var(--green)}
    </style>
</head>
<body>
    <div class="badge">STYL 8 · PODGLAD</div>
    <header class="wrap"><a class="logo" href="#">kupuj<span>pl</span>.games</a><input class="search" placeholder="grep --games"><nav class="nav"><a href="#">auth</a></nav></header>
    <div class="hero wrap"><h1>init_price_scan();</h1><p>// 87000 records loaded · steam gog epic humble</p></div>
    <main class="wrap">
        <div class="cats"><button class="cat active">all</button><button class="cat">action</button><button class="cat">rpg</button><button class="cat">indie</button></div>
        <div class="grid">
            <article class="card"><img src="https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/730/header.jpg" alt=""><div class="card-body"><h3>Counter-Strike 2</h3><div class="price">PLN 0.00</div></div></article>
            <article class="card"><img src="https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/292030/header.jpg" alt=""><div class="card-body"><h3>Wiedzmin 3</h3><div class="price">PLN 29.80</div></div></article>
            <article class="card"><img src="https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/1091500/header.jpg" alt=""><div class="card-body"><h3>Cyberpunk 2077</h3><div class="price">PLN 119.99</div></div></article>
            <article class="card"><img src="https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/1145360/header.jpg" alt=""><div class="card-body"><h3>Hades</h3><div class="price">PLN 47.99</div></div></article>
            <article class="card"><img src="https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/1245620/header.jpg" alt=""><div class="card-body"><h3>Elden Ring</h3><div class="price">PLN 149.99</div></div></article>
        </div>
    </main>
</body>
</html>
