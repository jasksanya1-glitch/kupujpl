<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styl 15 — Anime Pop | KupujPL</title>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#fff5f7;--surface:#fff;--pink:#ff6b9d;--pink-dark:#e8437a;--blue:#4dabf7;--yellow:#ffd43b;--text:#2d1b2e;--muted:#8b6b8e;--price:#e8437a}
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'M PLUS Rounded 1c',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
        body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 10% 20%,rgba(255,107,157,.15),transparent 40%),radial-gradient(circle at 90% 80%,rgba(77,171,247,.12),transparent 40%);pointer-events:none}
        .wrap{max-width:1180px;margin:0 auto;padding:0 20px;position:relative}
        .badge{position:fixed;top:16px;right:16px;z-index:99;background:var(--pink);color:#fff;padding:8px 16px;font-size:12px;font-weight:800;border-radius:999px;box-shadow:0 4px 0 var(--pink-dark)}
        header{display:flex;align-items:center;gap:20px;height:72px;background:var(--surface);border-radius:0 0 24px 24px;box-shadow:0 4px 20px rgba(255,107,157,.15);margin:0 -20px;padding:0 20px}
        .logo{font-size:24px;font-weight:800;text-decoration:none;color:var(--pink)}
        .logo span{color:var(--blue)}
        .search{flex:1;max-width:400px;height:44px;background:var(--bg);border:3px solid var(--pink);border-radius:999px;padding:0 18px;color:var(--text);font:inherit;font-weight:700}
        .search:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px rgba(77,171,247,.2)}
        .nav a{color:#fff;text-decoration:none;font-weight:800;font-size:14px;background:var(--blue);padding:10px 20px;border-radius:999px;box-shadow:0 4px 0 #339af0}
        .hero{padding:40px 0;text-align:center}
        .hero h1{font-size:clamp(2rem,5vw,3rem);font-weight:800;color:var(--pink);text-shadow:3px 3px 0 var(--yellow)}
        .hero p{color:var(--muted);margin-top:12px;font-weight:700;font-size:15px}
        .cats{display:flex;gap:10px;flex-wrap:wrap;padding:16px 0;justify-content:center}
        .cat{padding:10px 20px;background:var(--surface);border:3px solid var(--pink);border-radius:999px;color:var(--muted);font:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:.15s}
        .cat.active{background:var(--pink);color:#fff;border-color:var(--pink);transform:scale(1.05)}
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px;padding-bottom:48px}
        .card{background:var(--surface);border:3px solid var(--pink);border-radius:20px;overflow:hidden;transition:.2s;box-shadow:0 6px 0 var(--pink-dark)}
        .card:hover{transform:translateY(-4px);border-color:var(--blue);box-shadow:0 10px 0 #339af0}
        .card img{width:100%;aspect-ratio:460/215;object-fit:cover}
        .card-body{padding:14px 16px}
        .card h3{font-size:15px;font-weight:800;margin-bottom:6px}
        .price{color:var(--price);font-size:20px;font-weight:800}
    </style>
</head>
<body>
    <div class="badge">STYL 15 ★</div>
    <header class="wrap"><a class="logo" href="#">Kupuj<span>PL</span>!</a><input class="search" placeholder="Szukaj gier..."><nav class="nav"><a href="#">Zaloguj</a></nav></header>
    <div class="hero wrap"><h1>Kawaii ceny!<br>Super oferty!</h1><p>87 000+ gier · kawaii game store ♡</p></div>
    <main class="wrap">
        <div class="cats"><button class="cat active">Wszystkie</button><button class="cat">Akcja</button><button class="cat">RPG</button><button class="cat">Visual Novel</button></div>
        <div class="grid">
            <article class="card"><img src="https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/730/header.jpg" alt=""><div class="card-body"><h3>Counter-Strike 2</h3><div class="price">0,00 zł</div></div></article>
            <article class="card"><img src="https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/292030/header.jpg" alt=""><div class="card-body"><h3>Wiedźmin 3</h3><div class="price">29,80 zł</div></div></article>
            <article class="card"><img src="https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/1091500/header.jpg" alt=""><div class="card-body"><h3>Cyberpunk 2077</h3><div class="price">119,99 zł</div></div></article>
            <article class="card"><img src="https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/1145360/header.jpg" alt=""><div class="card-body"><h3>Hades</h3><div class="price">47,99 zł</div></div></article>
            <article class="card"><img src="https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/1245620/header.jpg" alt=""><div class="card-body"><h3>Elden Ring</h3><div class="price">149,99 zł</div></div></article>
        </div>
    </main>
</body>
</html>
