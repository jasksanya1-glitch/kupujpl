<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/games/static/favicon.svg?v=cp2077-11" type="image/svg+xml">
    <link rel="icon" href="/games/static/favicon.ico" sizes="any">
    <link rel="icon" href="/games/static/icons/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="/games/static/icons/favicon-16.png" type="image/png" sizes="16x16">
    <link rel="apple-touch-icon" href="/games/static/icons/apple-touch-icon.png">
    <link rel="manifest" href="/games/static/site.webmanifest">
    <meta name="theme-color" content="#0070d1">

    <base href="/games/">
    <title>Reset hasła — KupujPL Gry</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/style.css?v=8">
</head>
<body>
    <header class="header">
        <div class="wrap header-inner">
            <a href="./" class="brand"><span class="brand-name">Kupuj<span class="brand-accent">PL</span></span><span class="brand-sub">Gry</span></a>
            <nav id="auth-nav" class="auth-nav"></nav>
        </div>
    </header>
    <main class="wrap auth-page">
        <div class="auth-card">
            <h1>Reset hasła</h1>
            <p class="auth-sub">Podaj e-mail konta — wyślemy link do ustawienia nowego hasła.</p>
            <form id="forgot-form" class="auth-form">
                <label>E-mail<input type="email" name="email" required autocomplete="email"></label>
                <p id="forgot-error" class="form-error" hidden></p>
                <p id="forgot-success" class="form-success" hidden></p>
                <button type="submit" class="btn-primary" id="forgot-submit">Wyślij link resetujący</button>
            </form>
            <p class="auth-switch"><a href="login">Wróć do logowania</a></p>
        </div>
    </main>
    <script src="static/api-config.js"></script>
    <script src="static/auth.js"></script>
    <script>
        if (isLoggedIn()) window.location.href = 'panel';
        document.getElementById('forgot-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const err = document.getElementById('forgot-error');
            const ok = document.getElementById('forgot-success');
            const btn = document.getElementById('forgot-submit');
            err.hidden = true;
            ok.hidden = true;
            const fd = new FormData(e.target);
            btn.disabled = true;
            try {
                const res = await fetch(resolveApi('auth/forgot-password'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: fd.get('email') }),
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    err.textContent = data.detail || 'Nie udało się wysłać wiadomości.';
                    err.hidden = false;
                    btn.disabled = false;
                    return;
                }
                ok.textContent = data.message || 'Sprawdź skrzynkę e-mail.';
                ok.hidden = false;
                e.target.querySelector('input[name="email"]').disabled = true;
                btn.textContent = 'Wysłano';
            } catch {
                err.textContent = 'Błąd połączenia.';
                err.hidden = false;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
