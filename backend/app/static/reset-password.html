<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/games/static/favicon.svg?v=cp2077-11" type="image/svg+xml">
    <link rel="icon" href="/games/static/favicon.ico" sizes="any">
    <link rel="icon" href="/games/static/icons/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="/games/static/icons/favicon-16.png" type="image/png" sizes="16x16">
    <link rel="apple-touch-icon" href="/games/static/icons/apple-touch-icon.png">
    <link rel="manifest" href="/games/static/site.webmanifest">
    <meta name="theme-color" content="#0070d1">

    <base href="/games/">
    <title>Nowe hasło — KupujPL Gry</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/style.css?v=8">
</head>
<body>
    <header class="header">
        <div class="wrap header-inner">
            <a href="./" class="brand"><span class="brand-name">Kupuj<span class="brand-accent">PL</span></span><span class="brand-sub">Gry</span></a>
            <nav id="auth-nav" class="auth-nav"></nav>
        </div>
    </header>
    <main class="wrap auth-page">
        <div class="auth-card">
            <h1>Nowe hasło</h1>
            <p class="auth-sub">Ustaw nowe hasło do konta KupujPL Gry.</p>
            <form id="reset-form" class="auth-form" hidden>
                <label>Nowe hasło (min. 8 znaków)<input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
                <label>Powtórz hasło<input type="password" name="password2" required minlength="8" autocomplete="new-password"></label>
                <p id="reset-error" class="form-error" hidden></p>
                <p id="reset-success" class="form-success" hidden></p>
                <button type="submit" class="btn-primary">Zapisz nowe hasło</button>
            </form>
            <p id="reset-invalid" class="form-error" hidden></p>
            <p class="auth-switch"><a href="forgot-password">Wygeneruj nowy link</a> · <a href="login">Logowanie</a></p>
        </div>
    </main>
    <script src="static/api-config.js"></script>
    <script src="static/auth.js"></script>
    <script>
        if (isLoggedIn()) window.location.href = 'panel';
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code') || '';
        const form = document.getElementById('reset-form');
        const invalid = document.getElementById('reset-invalid');

        if (!code) {
            invalid.textContent = 'Brak kodu resetującego. Poproś o nowy link.';
            invalid.hidden = false;
        } else {
            form.hidden = false;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const err = document.getElementById('reset-error');
            const ok = document.getElementById('reset-success');
            err.hidden = true;
            ok.hidden = true;
            const fd = new FormData(e.target);
            if (fd.get('password') !== fd.get('password2')) {
                err.textContent = 'Hasła nie są identyczne';
                err.hidden = false;
                return;
            }
            try {
                const res = await fetch(resolveApi('auth/reset-password'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code, password: fd.get('password') }),
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    err.textContent = data.detail || 'Nie udało się zmienić hasła.';
                    err.hidden = false;
                    return;
                }
                ok.textContent = data.message || 'Hasło zmienione.';
                ok.hidden = false;
                form.hidden = true;
                setTimeout(() => { window.location.href = 'login'; }, 2000);
            } catch {
                err.textContent = 'Błąd połączenia.';
                err.hidden = false;
            }
        });
    </script>
</body>
</html>
