<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/games/static/favicon.svg?v=cp2077-11" type="image/svg+xml">
    <link rel="icon" href="/games/static/favicon.ico" sizes="any">
    <link rel="icon" href="/games/static/icons/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="/games/static/icons/favicon-16.png" type="image/png" sizes="16x16">
    <link rel="apple-touch-icon" href="/games/static/icons/apple-touch-icon.png">
    <link rel="manifest" href="/games/static/site.webmanifest">
    <meta name="theme-color" content="#fcee09">
    <script>
    (function(){try{var t=localStorage.getItem('kupujpl-theme');document.documentElement.dataset.theme=(!t||['night','ice','void','matrix'].indexOf(t)<0)?'night':t;}catch(e){document.documentElement.dataset.theme='night';}})();
    </script>

    <base href="/games/">
    <title>Logowanie — KupujPL Gry</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/style.css?v=66">
</head>
<body data-i18n-title="auth.login_title">
    <header class="header">
        <div class="wrap header-inner">
            <a href="./" class="brand"><span class="brand-name">Kupuj<span class="brand-accent">PL</span></span><span class="brand-sub">Gry</span></a>
            <nav id="auth-nav" class="auth-nav"></nav>
        </div>
    </header>
    <main class="wrap auth-page">
        <div class="auth-card">
            <h1 data-i18n="auth.login_title">Logowanie</h1>
            <p class="auth-sub" data-i18n="auth.login_sub">Zapisuj ulubione gry i wracaj do najlepszych cen.</p>
            <div id="google-signin" class="auth-oauth-wrap"></div>
            <p class="auth-oauth-note" id="auth-oauth-note-login" data-i18n-oauth hidden>Logując się przez Google…</p>
            <p class="auth-oauth-divider" id="auth-oauth-divider-login" hidden><span data-i18n="auth.oauth_divider">lub e-mail i hasło</span></p>
            <form id="login-form" class="auth-form">
                <label><span data-i18n="auth.email">E-mail</span><input type="email" name="email" required autocomplete="email"></label>
                <label><span data-i18n="auth.password">Hasło</span><input type="password" name="password" required autocomplete="current-password"></label>
                <p class="auth-forgot"><a href="forgot-password" data-i18n="auth.forgot">Zapomniałeś hasła?</a></p>
                <p id="login-error" class="form-error" hidden></p>
                <button type="submit" class="btn-primary" data-i18n="auth.submit_login">Zaloguj</button>
            </form>
            <p class="auth-switch"><span data-i18n="auth.no_account">Nie masz konta?</span> <a href="register" data-i18n="auth.go_register">Zarejestruj się</a></p>
            <p class="auth-legal" data-i18n-legal>Korzystając z serwisu, akceptujesz Regulamin i Politykę prywatności.</p>
        </div>
    </main>
    <footer class="footer">
        <div class="wrap footer-inner">
            <nav class="footer-nav" data-i18n-aria="nav.legal" aria-label="Informacje prawne">
                <a href="regulamin" class="footer-btn" data-i18n="nav.regulamin">Regulamin</a>
                <a href="polityka-prywatnosci" class="footer-btn" data-i18n="nav.privacy">Polityka prywatności</a>
                <a href="kontakt" class="footer-btn" data-i18n="nav.contact">Kontakt</a>
                <a href="wsparcie" class="footer-btn footer-btn--donate" data-i18n="nav.support">☕ Wsparcie</a>
            </nav>
        </div>
    </footer>
    <script src="static/i18n.js?v=12"></script>
    <script src="static/theme.js?v=2"></script>
    <script src="static/matrix-rain.js?v=1"></script>
    <script src="static/cookie-consent.js?v=1"></script>
    <script src="static/api-config.js?v=4"></script>
    <script src="static/auth.js?v=6"></script>
    <script src="static/google-auth.js?v=3"></script>
    <script>
        redirectIfValidSession('panel').then((gone) => {
            if (gone) return;
            initGoogleSignIn('google-signin', 'login-error').then(() => {
                const div = document.getElementById('auth-oauth-divider-login');
                const note = document.getElementById('auth-oauth-note-login');
                const g = document.getElementById('google-signin');
                if (g && g.querySelector('iframe, div[role=button]')) {
                    if (div) div.hidden = false;
                    if (note) note.hidden = false;
                }
            });
            document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const err = document.getElementById('login-error');
            err.hidden = true;
            const fd = new FormData(e.target);
            const tt = (k) => (typeof t === 'function' ? t(k) : k);
            try {
                const res = await fetch(resolveApi('auth/login'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: fd.get('email'), password: fd.get('password') }),
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) { err.textContent = data.detail || tt('auth.err_login'); err.hidden = false; return; }
                setAuth(data.access_token, data.user);
                window.location.href = 'panel';
            } catch { err.textContent = tt('auth.err_connection'); err.hidden = false; }
            });
        });
    </script>
</body>
</html>
