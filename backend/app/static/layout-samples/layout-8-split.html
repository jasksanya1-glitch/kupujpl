<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Układ 8 — Split featured | KupujPL</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="layout-base.css">
    <style>
        .cats { display: flex; gap: 8px; flex-wrap: wrap; padding: 16px 20px; max-width: var(--wrap); margin: 0 auto; }
        .split { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: var(--wrap); margin: 0 auto; padding: 0 20px 48px; }
        @media (max-width: 800px) { .split { grid-template-columns: 1fr; } }
        .hero-card { border-radius: 16px; overflow: hidden; background: var(--surface); }
        .hero-card img { width: 100%; aspect-ratio: 16/10; object-fit: cover; }
        .hero-card .card-body { padding: 20px; }
        .hero-card h2 { font-size: 24px; margin-bottom: 8px; }
        .hero-card .price { font-size: 22px; }
        .list .card { display: grid; grid-template-columns: 120px 1fr; gap: 12px; margin-bottom: 10px; background: var(--surface); border-radius: 10px; overflow: hidden; }
        .list .card img { aspect-ratio: 460/215; height: 100%; }
        .list .card-body { display: flex; flex-direction: column; justify-content: center; padding: 10px 12px 10px 0; }
        .list .card h3 { font-size: 14px; margin: 0 0 4px; }
    </style>
</head>
<body>
    <div class="badge">UKŁAD 8</div>
    <header class="site wrap"><a class="logo" href="#">Kupuj<span>PL</span></a><input class="search" placeholder="Szukaj…"><a class="nav" href="#">Zaloguj</a></header>
    <div class="cats" id="cats"></div>
    <div class="split">
        <article class="hero-card">
            <img src="https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/1091500/header.jpg" alt="">
            <div class="card-body"><h2>Cyberpunk 2077</h2><p style="color:var(--muted);font-size:14px;margin-bottom:12px">Okazja dnia · porównaj 7 sklepów</p><div class="price">119,99 zł</div></div>
        </article>
        <div class="list" id="list"></div>
    </div>
    <script src="layout-shared.js"></script>
    <script>
        document.getElementById('cats').innerHTML = catsHtml('cat');
        document.getElementById('list').innerHTML = MOCK_GAMES.slice(1,6).map(g =>
            `<article class="card"><img src="${g.img}" alt=""><div class="card-body"><h3>${g.title}</h3><div class="price">${g.price}</div></div></article>`
        ).join('');
    </script>
</body>
</html>
