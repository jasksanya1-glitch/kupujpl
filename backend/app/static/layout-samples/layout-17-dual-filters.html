<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Układ 17 — Dwie linie filtrów | KupujPL</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="layout-base.css">
    <style>
        .filters { max-width: var(--wrap); margin: 0 auto; padding: 16px 20px 0; }
        .row1 { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
        .row1 .cat { font-size: 14px; padding: 12px 22px; }
        .row2 { display: flex; gap: 6px; flex-wrap: wrap; }
        .tag { padding: 6px 12px; font-size: 11px; border-radius: 999px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); cursor: pointer; }
        .tag.on { background: rgba(45,156,255,.15); color: var(--blue-light); border-color: var(--blue); }
        main { max-width: var(--wrap); margin: 0 auto; padding: 20px 20px 48px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(195px, 1fr)); gap: 14px; }
    </style>
</head>
<body>
    <div class="badge">UKŁAD 17</div>
    <header class="site wrap"><a class="logo" href="#">Kupuj<span>PL</span></a><input class="search" placeholder="Szukaj…"><a class="nav" href="#">Zaloguj</a></header>
    <div class="filters">
        <div class="row1" id="cats"></div>
        <div class="row2">
            <span class="tag on">Steam</span><span class="tag">GOG</span><span class="tag">Epic</span>
            <span class="tag">Do 50 zł</span><span class="tag">Oficjalne</span><span class="tag">Keyshop</span>
        </div>
    </div>
    <main><div class="grid" id="grid"></div></main>
    <script src="layout-shared.js"></script>
    <script>
        document.getElementById('cats').innerHTML = catsHtml('cat');
        document.getElementById('grid').innerHTML = MOCK_GAMES.map(cardHtml).join('');
    </script>
</body>
</html>
