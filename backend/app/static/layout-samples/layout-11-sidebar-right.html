<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Układ 11 — Sidebar prawy | KupujPL</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="layout-base.css">
    <style>
        .layout { display: grid; grid-template-columns: 1fr 240px; gap: 24px; padding: 24px 20px 48px; max-width: var(--wrap); margin: 0 auto; }
        .sidebar { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; height: fit-content; position: sticky; top: 80px; order: 2; }
        .sidebar h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 12px; }
        .sidebar .cat { display: block; width: 100%; text-align: left; border-radius: 8px; margin-bottom: 6px; border: none; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; order: 1; }
    </style>
</head>
<body>
    <div class="badge">UKŁAD 11</div>
    <header class="site wrap"><a class="logo" href="#">Kupuj<span>PL</span></a><input class="search" placeholder="Szukaj…"><a class="nav" href="#">Zaloguj</a></header>
    <div class="layout">
        <div class="grid" id="grid"></div>
        <aside class="sidebar"><h2>Filtruj</h2><div id="cats"></div></aside>
    </div>
    <script src="layout-shared.js"></script>
    <script>
        document.getElementById('cats').innerHTML = MOCK_CATS.map((c,i)=>`<button class="cat${i===0?' active':''}">${c}</button>`).join('');
        document.getElementById('grid').innerHTML = MOCK_GAMES.map(cardHtml).join('');
    </script>
</body>
</html>
