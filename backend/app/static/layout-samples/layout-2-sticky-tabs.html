<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Układ 2 — Sticky tabs | KupujPL</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="layout-base.css">
    <style>
        .tabs-bar { position: sticky; top: 64px; z-index: 50; background: var(--bg); border-bottom: 1px solid var(--border); padding: 12px 0; }
        .tabs { display: flex; gap: 8px; overflow-x: auto; max-width: var(--wrap); margin: 0 auto; padding: 0 20px; }
        .tabs::-webkit-scrollbar { height: 4px; }
        main { max-width: var(--wrap); margin: 0 auto; padding: 24px 20px 48px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
        .head { margin-bottom: 20px; }
        .head h1 { font-size: 24px; }
        .head p { color: var(--muted); font-size: 14px; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="badge">UKŁAD 2</div>
    <header class="site wrap"><a class="logo" href="#">Kupuj<span>PL</span></a><input class="search" placeholder="Szukaj gry…"><a class="nav" href="#">Zaloguj</a></header>
    <nav class="tabs-bar"><div class="tabs" id="tabs"></div></nav>
    <main>
        <div class="head"><h1>Popularne gry</h1><p>Kategorie przyklejone pod nagłówkiem — przewijaj w bok</p></div>
        <div class="grid" id="grid"></div>
    </main>
    <script src="layout-shared.js"></script>
    <script>
        document.getElementById('tabs').innerHTML = catsHtml('cat');
        document.getElementById('grid').innerHTML = MOCK_GAMES.map(cardHtml).join('');
    </script>
</body>
</html>
