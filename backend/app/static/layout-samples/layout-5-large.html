<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Układ 5 — Duże karty | KupujPL</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="layout-base.css">
    <style>
        .cats { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; padding: 20px; max-width: var(--wrap); margin: 0 auto; }
        main { max-width: var(--wrap); margin: 0 auto; padding: 0 20px 48px; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
        .card { position: relative; }
        .card-body { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(0,0,0,.85)); padding: 40px 16px 16px; }
        .card h3 { font-size: 18px; margin-bottom: 8px; }
        .price { font-size: 20px; }
    </style>
</head>
<body>
    <div class="badge">UKŁAD 5</div>
    <header class="site wrap"><a class="logo" href="#">Kupuj<span>PL</span></a><input class="search" placeholder="Szukaj gry…"><a class="nav" href="#">Zaloguj</a></header>
    <div class="cats" id="cats"></div>
    <main><div class="grid" id="grid"></div></main>
    <script src="layout-shared.js"></script>
    <script>
        document.getElementById('cats').innerHTML = catsHtml('cat');
        document.getElementById('grid').innerHTML = MOCK_GAMES.slice(0,6).map(cardHtml).join('');
    </script>
</body>
</html>
