<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Układ 24 — Split screen | KupujPL</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="layout-base.css">
    <style>
        body { overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        .split { display: grid; grid-template-columns: 280px 1fr; flex: 1; min-height: 0; }
        .split-left { background: var(--surface); border-right: 1px solid var(--border); padding: 20px 16px; overflow-y: auto; }
        .split-left h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 12px; }
        .split-left .cat { display: block; width: 100%; text-align: left; margin-bottom: 6px; }
        .split-right { overflow-y: auto; padding: 20px; }
        .split-right h1 { font-size: 22px; margin-bottom: 16px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
        @media (max-width: 768px) { .split { grid-template-columns: 1fr; } .split-left { max-height: 120px; } }
    </style>
</head>
<body>
    <div class="badge">UKŁAD 24</div>
    <header class="site wrap"><a class="logo" href="#">Kupuj<span>PL</span></a><input class="search" placeholder="Szukaj…"><a class="nav" href="#">Zaloguj</a></header>
    <div class="split">
        <aside class="split-left">
            <h2>Kategorie</h2>
            <div id="cats"></div>
        </aside>
        <div class="split-right">
            <h1>Wszystkie gry</h1>
            <div class="grid" id="grid"></div>
        </div>
    </div>
    <script src="layout-shared.js"></script>
    <script>
        document.getElementById('cats').innerHTML = MOCK_CATS.map((c, i) =>
            `<button type="button" class="cat${i === 0 ? ' active' : ''}">${c}</button>`
        ).join('');
        document.getElementById('grid').innerHTML = MOCK_GAMES.map(cardHtml).join('');
    </script>
</body>
</html>
