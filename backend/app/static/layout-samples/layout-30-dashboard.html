<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Układ 30 — Dashboard | KupujPL</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="layout-base.css">
    <style>
        main { max-width: var(--wrap); margin: 0 auto; padding: 20px 20px 48px; }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
        .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
        .stat-val { font-size: 28px; font-weight: 700; color: var(--blue-light); }
        .stat-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-top: 4px; }
        .cats { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
        @media (max-width: 720px) { .stats { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>
    <div class="badge">UKŁAD 30</div>
    <header class="site wrap"><a class="logo" href="#">Kupuj<span>PL</span></a><input class="search" placeholder="Szukaj…"><a class="nav" href="#">Zaloguj</a></header>
    <main>
        <div class="stats">
            <div class="stat"><div class="stat-val">87k+</div><div class="stat-label">Gier</div></div>
            <div class="stat"><div class="stat-val">85</div><div class="stat-label">Kategorii</div></div>
            <div class="stat"><div class="stat-val">7</div><div class="stat-label">Sklepów</div></div>
            <div class="stat"><div class="stat-val">0 zł</div><div class="stat-label">Od (min)</div></div>
        </div>
        <div class="cats" id="cats"></div>
        <p class="section-title">Popularne teraz</p>
        <div class="grid" id="grid"></div>
    </main>
    <script src="layout-shared.js"></script>
    <script>
        document.getElementById('cats').innerHTML = catsHtml('cat');
        document.getElementById('grid').innerHTML = MOCK_GAMES.map(cardHtml).join('');
    </script>
</body>
</html>
