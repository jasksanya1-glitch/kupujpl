<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Układ 28 — Timeline feed | KupujPL</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="layout-base.css">
    <style>
        main { max-width: 640px; margin: 0 auto; padding: 20px 20px 48px; }
        .cats { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; }
        .feed-item { display: flex; gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
        .feed-item:hover { background: rgba(0,112,209,.05); margin: 0 -12px; padding: 16px 12px; border-radius: 8px; }
        .feed-avatar { width: 56px; height: 56px; border-radius: 12px; overflow: hidden; flex-shrink: 0; }
        .feed-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .feed-body { flex: 1; min-width: 0; }
        .feed-body h3 { font-size: 15px; margin-bottom: 4px; }
        .feed-meta { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
        .feed-meta strong { color: var(--blue-light); }
        .feed-price { font-size: 17px; font-weight: 700; color: var(--blue-light); }
    </style>
</head>
<body>
    <div class="badge">UKŁAD 28</div>
    <header class="site wrap"><a class="logo" href="#">Kupuj<span>PL</span></a><input class="search" placeholder="Szukaj…"><a class="nav" href="#">Zaloguj</a></header>
    <main>
        <div class="cats" id="cats"></div>
        <div id="feed"></div>
    </main>
    <script src="layout-shared.js"></script>
    <script>
        document.getElementById('cats').innerHTML = catsHtml('cat');
        document.getElementById('feed').innerHTML = MOCK_GAMES.map((g, i) => `
            <article class="feed-item">
                <div class="feed-avatar"><img src="${g.img}" alt=""></div>
                <div class="feed-body">
                    <h3>${g.title}</h3>
                    <p class="feed-meta">Najniższa cena w <strong>Steam</strong> · ${i + 1} min temu</p>
                    <div class="feed-price">${g.price}</div>
                </div>
            </article>
        `).join('');
    </script>
</body>
</html>
