<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Układ 25 — Tag cloud | KupujPL</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="layout-base.css">
    <style>
        .cloud { max-width: var(--wrap); margin: 0 auto; padding: 24px 20px; text-align: center; line-height: 2.2; }
        .cloud span { display: inline-block; margin: 4px 8px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--border); cursor: pointer; transition: .15s; }
        .cloud span:hover, .cloud span.active { border-color: var(--blue); color: var(--blue-light); background: rgba(0,112,209,.12); }
        .cloud .s1 { font-size: 12px; opacity: .7; }
        .cloud .s2 { font-size: 14px; }
        .cloud .s3 { font-size: 16px; font-weight: 600; }
        .cloud .s4 { font-size: 20px; font-weight: 700; color: var(--blue-light); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; max-width: var(--wrap); margin: 0 auto; padding: 0 20px 48px; }
    </style>
</head>
<body>
    <div class="badge">UKŁAD 25</div>
    <header class="site wrap"><a class="logo" href="#">Kupuj<span>PL</span></a><input class="search" placeholder="Szukaj…"><a class="nav" href="#">Zaloguj</a></header>
    <div class="cloud" id="cloud"></div>
    <div class="grid" id="grid"></div>
    <script src="layout-shared.js"></script>
    <script>
        const sizes = ['s1','s2','s3','s4','s2','s3','s1'];
        document.getElementById('cloud').innerHTML = MOCK_CATS.map((c, i) =>
            `<span class="${sizes[i % sizes.length]}${i === 0 ? ' active' : ''}">${c}</span>`
        ).join('');
        document.getElementById('grid').innerHTML = MOCK_GAMES.map(cardHtml).join('');
    </script>
</body>
</html>
