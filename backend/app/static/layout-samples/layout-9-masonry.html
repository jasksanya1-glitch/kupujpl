<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Układ 9 — Masonry mix | KupujPL</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="layout-base.css">
    <style>
        .top-cats { position: sticky; top: 64px; z-index: 40; background: rgba(0,0,0,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); padding: 12px 0; }
        .top-cats .inner { display: flex; gap: 8px; overflow-x: auto; max-width: var(--wrap); margin: 0 auto; padding: 0 20px; }
        main { max-width: var(--wrap); margin: 0 auto; padding: 24px 20px 48px; }
        .masonry { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 8px; gap: 12px; }
        @media (max-width: 900px) { .masonry { grid-template-columns: repeat(2, 1fr); } }
        .masonry .card { grid-row-end: span 26; }
        .masonry .card.wide { grid-column: span 2; grid-row-end: span 32; }
        .masonry .card.tall { grid-row-end: span 34; }
    </style>
</head>
<body>
    <div class="badge">UKŁAD 9</div>
    <header class="site wrap"><a class="logo" href="#">Kupuj<span>PL</span></a><input class="search" placeholder="Szukaj…"><a class="nav" href="#">Zaloguj</a></header>
    <div class="top-cats"><div class="inner" id="cats"></div></div>
    <main><p style="color:var(--muted);font-size:14px;margin-bottom:16px">Masonry — pierwsze karty większe, reszta regularna</p><div class="masonry" id="grid"></div></main>
    <script src="layout-shared.js"></script>
    <script>
        document.getElementById('cats').innerHTML = catsHtml('cat');
        const sizes = ['wide', 'tall', '', '', 'wide', '', 'tall', ''];
        document.getElementById('grid').innerHTML = MOCK_GAMES.map((g, i) => {
            const cls = sizes[i] || '';
            return `<article class="card ${cls}"><img src="${g.img}" alt=""><div class="card-body"><h3>${g.title}</h3><div class="price">${g.price}</div></div></article>`;
        }).join('');
    </script>
</body>
</html>
