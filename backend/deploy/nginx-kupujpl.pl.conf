# Snapshot of /etc/nginx/sites-enabled/kupujpl.pl (SEO www→apex fix)
# Apply on VPS only after: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 443 ssl; # managed by Certbot
    server_name kupujpl.pl;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://apis.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://accounts.google.com; frame-src https://accounts.google.com; base-uri 'self'; form-action 'self'" always;

    location = / {
        return 301 /games/;
    }

    # Google expects robots at host root with HTTP 200 (not a redirect).
    location = /robots.txt {
        proxy_pass http://127.0.0.1:8010/robots.txt;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /llms.txt {
        return 301 /games/llms.txt;
    }

    location = /sitemap.xml {
        return 301 /games/sitemap.xml;
    }

    location = /sitemap-games.xml {
        return 301 /games/sitemap-games.xml;
    }

    location = /sitemap-categories.xml {
        return 301 /games/sitemap-categories.xml;
    }

    location = /sitemap-deals.xml {
        return 301 /games/sitemap-deals.xml;
    }

    location = /sitemap-blog.xml {
        return 301 /games/sitemap-blog.xml;
    }

    include snippets/putka-salary.conf;
    location = /dur-app {
        return 301 /dur-app/;
    }

    location /dur-app/api/ {
        client_max_body_size 60m;
        proxy_pass http://127.0.0.1:8787/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /dur-app/ {
        proxy_pass http://127.0.0.1:8787/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Umami analytics (BASE_PATH=/ua) — tracker + dashboard
    location = /ua {
        return 301 /ua/;
    }
    location /ua/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /games/api/admin/ {
        limit_req zone=games_admin burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8010/api/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /games/ {
        proxy_pass http://127.0.0.1:8010/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    ssl_certificate /etc/letsencrypt/live/kupujpl.pl/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/kupujpl.pl/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# HTTP → HTTPS apex (single hop; preserves path + query)
server {
    listen 80;
    listen [::]:80;
    server_name kupujpl.pl www.kupujpl.pl;
    return 301 https://kupujpl.pl$request_uri;
}

# HTTPS www → apex (single hop)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.kupujpl.pl;
    ssl_certificate /etc/letsencrypt/live/kupujpl.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kupujpl.pl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://kupujpl.pl$request_uri;
}
