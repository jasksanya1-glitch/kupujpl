# go.d python collector — Tier A scan (laptop)
jobs:
  - name: tier_a_scan
    plugin: python
    script: D:/CursorProjects/kupujpl-games/backend/scripts/netdata_tier_a.py
    update_every: 5
    priority: 100000
    charts:
      tier_a_laptop_done:
        options: [tier_a, laptop, done]
      tier_a_laptop_total:
        options: [tier_a, laptop, total]
      tier_a_laptop_progress_pct:
        options: [tier_a, laptop, progress]
      tier_a_vps_done:
        options: [tier_a, vps, done]
      tier_a_vps_total:
        options: [tier_a, vps, total]
      tier_a_vps_progress_pct:
        options: [tier_a, vps, progress]
      tier_a_list_ready:
        options: [tier_a, list, ready]
      tier_a_vps_eta_sec:
        options: [tier_a, vps, eta]
      tier_a_laptop_eta_sec:
        options: [tier_a, laptop, eta]
